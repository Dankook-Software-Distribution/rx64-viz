<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xv6-viz</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <b>xv6-viz</b>
    <nav class="seg" id="kernels"></nav>
    <button type="button" class="menu-btn" id="btn-menu">View</button>
    <span class="right">
      <span class="tg">
        <button type="button" class="icon" id="tg-left" title="Left side bar  Ctrl+B"><i class="ico l"></i></button>
        <button type="button" class="icon" id="tg-bottom" title="Panel  Ctrl+J"><i class="ico b"></i></button>
        <button type="button" class="icon" id="tg-right" title="Right side bar  Ctrl+Alt+B"><i class="ico r"></i></button>
      </span>
      <label><input type="checkbox" id="chk-follow" checked> Follow new process</label>
      <label><input type="checkbox" id="chk-refresh" checked> Auto refresh</label>
      <button type="button" id="btn-pause">Pause</button>
      <button type="button" id="btn-restart">Reboot</button>
    </span>
  </header>
  <div class="trace" id="trace"></div>
  <div class="error" id="error" role="alert" hidden></div>

  <div id="work" class="work"></div>

  <footer class="statusbar"><span id="status" class="status"></span></footer>

  <script type="module" src="app.js"></script>
</body>
</html>
