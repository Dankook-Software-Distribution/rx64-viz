server:
  port: 8080

spring:
  web:
    resources:
      # the built web UI (web/ -> /work/web in the image)
      static-locations: file:/work/web/

rxviz:
  plugin: /work/plugin/rxtrace.so
  # sessions and their recordings live here
  data-dir: /data
  # one guest instruction = 2^shift ns of guest time (QEMU -icount)
  icount-shift: 3
  # Per kernel: what the indexer cannot read from the ELF. Exception
  # vectors 0-31 are named in code (they are the same on every x86).
  kernels:
    - id: rx64-x86-style
      dir: /work/kernels/rx64-x86-style
      # KSTACK(p) = KSTACKBASE + (2p + 1) * PGSIZE, KSTACKBASE = P2V(PHYSTOP)
      kstack-base: "0xffffffff88001000"
      kstack-stride: "0x2000"
      syscall-vector: 64
      # argraw() in kernel/syscall.c: the 4th argument comes in r10
      syscall-args: [ rdi, rsi, rdx, r10, r8, r9 ]
      # entry.S's boot stack (KSTACKSIZE): CPU 0's scheduler stack
      cpu-stacks:
        - symbol: bootstack
          size: 4096
      # P2V(0): all of RAM is mapped at KERNBASE + pa
      direct-map: "0xffffffff80000000"
      # kernel-only mappings, besides the kernel image and kernel stacks
      # (memlayout.h); the first match wins
      regions:
        - { va: "0xffffffff80000000", size: "0x8000000", kind: ram, label: "RAM at KERNBASE + pa (P2V)" }
        - { va: "0xfffffffffec00000", size: "0x1000", kind: device, label: "IOAPIC (DEV2V)", pa: "0xfec00000" }
        - { va: "0xfffffffffee00000", size: "0x1000", kind: device, label: "LAPIC (DEV2V)", pa: "0xfee00000" }
        - { va: "0xffffffff00000000", size: "0x100000000", kind: device, label: "PCI device registers (DEV2V)", pa: "0x0" }
      vectors:
        "32": timer interrupt
        "36": uart interrupt
        "56": virtio disk interrupt
        "255": spurious interrupt
    - id: rx64-riscv-style
      dir: /work/kernels/rx64-riscv-style
      # KSTACK(p) = CPUENTRY - (p + 1) * 2 * PGSIZE, CPUENTRY = MAXVA - 4 * PGSIZE
      kstack-base: "0x7fffffffa000"
      kstack-stride: "-0x2000"
      syscall-vector: 64
      # argraw() in kernel/proc/syscall.c: the 4th argument comes in rcx
      syscall-args: [ rdi, rsi, rdx, rcx, r8, r9 ]
      # start.c's stack0[4096 * NCPU]: CPU i runs on the i-th 4096 bytes
      cpu-stacks:
        - symbol: stack0
          size: 4096
      # the kernel page table maps RAM at its own address
      direct-map: "0x0"
      # kernel-only mappings, besides the kernel image and kernel stacks
      # (memlayout.h); the first match wins
      regions:
        - { va: "0x7ffffffff000", size: "0x1000", kind: trampoline, label: "TRAMPOLINE" }
        - { va: "0x7fffffffe000", size: "0x1000", kind: trapframe, label: "TRAPFRAME" }
        - { va: "0x7fffffffc000", size: "0x2000", kind: cpuentry, label: "CPUENTRY (GDT, TSS, IDT)" }
        - { va: "0x8000", size: "0x1000", kind: other, label: "APENTRY (other CPUs' first code)" }
        - { va: "0x0", size: "0x8000000", kind: ram, label: "RAM at its own address" }
        - { va: "0xfec00000", size: "0x1000", kind: device, label: "IOAPIC", pa: "0xfec00000" }
        - { va: "0xfee00000", size: "0x1000", kind: device, label: "LAPIC", pa: "0xfee00000" }
        # where the BIOS put the PCI devices' registers (BARs) on this machine;
        # the rest above RAM holds nothing
        - { va: "0xfe000000", size: "0xc00000", kind: device, label: "PCI device registers", pa: "0xfe000000" }
      vectors:
        "32": timer interrupt
        "36": uart interrupt
        "55": virtio disk interrupt
        "255": spurious interrupt
      # TSS rsp0 points at the end of the trapframe in the TRAPFRAME page
      user-trap-stack-pages: [ "0x7fffffffe000" ]
      # trampoline.S is linked into the kernel image but runs at TRAMPOLINE
      aliases:
        - va: "0x7ffffffff000"
          symbol: trampoline
          size: 4096
  syscalls: [ "", fork, exit, wait, pipe, read, kill, exec, fstat, chdir, dup,
              getpid, sbrk, pause, uptime, open, write, mknod, unlink, link,
              mkdir, close, sync ]
  phys-mem-bytes: 134217728
  # Lock helpers that stepping by line (and Events, with the step filter
  # on) skips: step into treats a call to them like step over.
  step-skip: [ acquire, release, push_off, pop_off, holding, mycpu ]
